<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIMS Donation Platform</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle, rgba(29,96,144,0.08) 1px, transparent 1px),
                linear-gradient(135deg, #e8f1ff, #f8fbff, #eaf7f3);
            background-size: 25px 25px, cover;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #123b70, #1d6090, #258b83);
            color: white;
            text-align: center;
            padding: 35px 20px;
            border-radius: 0 0 50px 50px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 34px;
        }

        header h2 {
            margin: 10px 0;
            font-size: 22px;
            font-weight: normal;
        }

        header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: rgba(255,255,255,0.95);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            background: #e8f1ff;
            border-radius: 50%;
            top: -90px;
            right: -70px;
            z-index: 0;
        }

        .container::after {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            background: #eaf7f3;
            border-radius: 50%;
            bottom: -60px;
            left: -50px;
            z-index: 0;
        }

        form {
            position: relative;
            z-index: 1;
        }

        .section-title {
            display: inline-block;
            font-family: Georgia, serif;
            font-size: 24px;
            color: #123b70;
            background: #e8f1ff;
            padding: 10px 25px;
            border-radius: 30px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            color: #123b70;
            margin-bottom: 8px;
        }

        .required {
            color: red;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #c8d8e8;
            border-radius: 12px;
            background: #f8fbff;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #258b83;
            box-shadow: 0 0 5px rgba(37,139,131,0.2);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .other-input {
            display: none;
            margin-top: 10px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            border: none;
            padding: 13px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .save-btn {
            background: linear-gradient(135deg, #1d6090, #258b83);
            color: white;
        }

        .clear-btn {
            background: #777;
            color: white;
        }

        .quote {
            text-align: center;
            margin-top: 30px;
            color: #258b83;
            font-family: Georgia, serif;
            font-style: italic;
            font-size: 17px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .container {
                width: 94%;
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            header h1 {
                font-size: 27px;
            }

            header h2 {
                font-size: 18px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>NIMS DONATION PLATFORM</h1>
    <h2>Student Details & Donation Management</h2>
    <p>Together We Can Make a Difference</p>
</header>

<div class="container">

    <form id="donationForm">

        <div class="section-title">Student Details</div>

        <div class="form-grid">

            <div class="form-group">
                <label>Student Name <span class="required">*</span></label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter full name"
                    pattern="[A-Za-z ]+"
                    required
                >
            </div>

            <div class="form-group">
                <label>Enrollment Number <span class="required">*</span></label>
                <input
                    type="text"
                    id="enrollmentNo"
                    placeholder="Enter enrollment number"
                    required
                >
            </div>

            <div class="form-group">
                <label>Course / Program <span class="required">*</span></label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option>MBBS</option>
                    <option>BDS</option>
                    <option>B.Pharm</option>
                    <option>B.Sc. Nursing</option>
                    <option>BBA</option>
                    <option>BBA-LLB</option>
                    <option>B.Sc. Radiology</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>B.Sc.</option>
                    <option>BA</option>
                    <option>Other</option>
                </select>
                <input
                    type="text"
                    id="courseOther"
                    class="other-input"
                    placeholder="Enter course"
                >
            </div>

            <div class="form-group">
                <label>Current Year <span class="required">*</span></label>
                <select id="year" required>
                    <option value="">Select Year</option>
                    <option>1st Year</option>
                    <option>2nd Year</option>
                    <option>3rd Year</option>
                    <option>4th Year</option>
                    <option>5th Year</option>
                    <option>6th Year</option>
                    <option>7th Year</option>
                    <option>8th Year</option>
                    <option>Other</option>
                </select>
                <input
                    type="text"
                    id="yearOther"
                    class="other-input"
                    placeholder="Enter year"
                >
            </div>

            <div class="form-group">
                <label>Semester</label>
                <select id="semester">
                    <option value="">Select Semester</option>
                    <option>1st Semester</option>
                    <option>2nd Semester</option>
                    <option>3rd Semester</option>
                    <option>4th Semester</option>
                    <option>5th Semester</option>
                    <option>6th Semester</option>
                    <option>7th Semester</option>
                    <option>8th Semester</option>
                    <option>Other</option>
                </select>
                <input
                    type="text"
                    id="semesterOther"
                    class="other-input"
                    placeholder="Enter semester"
                >
            </div>

            <div class="form-group">
                <label>Section <span class="required">*</span></label>
                <select id="section" required>
                    <option value="">Select Section</option>
                    <option>Section A</option>
                    <option>Section B</option>
                    <option>Section C</option>
                    <option>Section D</option>
                    <option>Section E</option>
                    <option>Section F</option>
                    <option>Section G</option>
                    <option>Section H</option>
                    <option>Section I</option>
                    <option>Section J</option>
                    <option>Section K</option>
                    <option>Section L</option>
                    <option>Section M</option>
                    <option>Other</option>
                </select>
                <input
                    type="text"
                    id="sectionOther"
                    class="other-input"
                    placeholder="Enter section"
                >
            </div>

            <div class="form-group">
                <label>College Name <span class="required">*</span></label>
                <input
                    type="text"
                    id="collegeName"
                    placeholder="Enter college name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email ID <span class="required">*</span></label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Contact Number <span class="required">*</span></label>
                <input
                    type="tel"
                    id="contactNo"
                    placeholder="Enter 10 digit number"
                    inputmode="numeric"
                    maxlength="10"
                    minlength="10"
                    pattern="[0-9]{10}"
                    required
                >
            </div>

            <div class="form-group full">
                <label>Things u Want to Donate <span class="required">*</span></label>
                <textarea
                    id="donation"
                    placeholder="Enter things you want to donate for Needy people .... Example: Books, clothes, stationery, food, study material etc.
                  
                
                --A helping hand for those in need for a better life--"
                    required
                ></textarea>
            </div>

        </div>

        <div class="buttons">
            <button type="submit" class="save-btn">Save Details</button>
            <button type="reset" class="clear-btn">Clear</button>
        </div>

        <div class="quote">
            “A small act of giving can create a big change.”
        </div>

    </form>

</div>

<footer>
    NIMS Donation Platform • Student Project
</footer>

<script>

    const scriptURL = "https://script.google.com/macros/s/AKfycbzdDM7WfDB28vpelVkk6HoeLGHEwJKBJvJKlEwbx-zX0Z-yN86c-J52B5GoodrglOUU/exec";

    function showOther(selectId, inputId) {
        const select = document.getElementById(selectId);
        const input = document.getElementById(inputId);

        select.addEventListener("change", function () {
            if (this.value === "Other") {
                input.style.display = "block";
                input.required = true;
            } else {
                input.style.display = "none";
                input.required = false;
                input.value = "";
            }
        });
    }

    showOther("course", "courseOther");
    showOther("year", "yearOther");
    showOther("semester", "semesterOther");
    showOther("section", "sectionOther");

    document.getElementById("studentName").addEventListener("input", function () {
        this.value = this.value.replace(/[^A-Za-z ]/g, "");
    });

    document.getElementById("contactNo").addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 10);
    });

    document.getElementById("donationForm").addEventListener("submit", function (e) {

        e.preventDefault();

        const course = document.getElementById("course").value === "Other"
            ? document.getElementById("courseOther").value
            : document.getElementById("course").value;

        const year = document.getElementById("year").value === "Other"
            ? document.getElementById("yearOther").value
            : document.getElementById("year").value;

        const semester = document.getElementById("semester").value === "Other"
            ? document.getElementById("semesterOther").value
            : document.getElementById("semester").value;

        const section = document.getElementById("section").value === "Other"
            ? document.getElementById("sectionOther").value
            : document.getElementById("section").value;

        const contactNo = document.getElementById("contactNo").value;

        if (contactNo.length !== 10) {
            alert("Please enter exactly 10 digits for the contact number.");
            return;
        }

        const data = {
            studentName: document.getElementById("studentName").value,
            enrollmentNo: document.getElementById("enrollmentNo").value,
            course: course,
            year: year,
            semester: semester,
            section: section,
            collegeName: document.getElementById("collegeName").value,
            email: document.getElementById("email").value,
            contactNo: contactNo,
            donation: document.getElementById("donation").value
        };

        fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
        });

        setTimeout(function () {
            window.location.href = "thankyou.html";
        }, 1500);
    });

</script>

</body>
</html>
