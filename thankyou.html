<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You - NIMS Donation Platform</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #e8f1ff,
                #f8fbff,
                #eaf7f3
            );
        }

        .thank-you {
            text-align: center;

            background: white;

            padding: 50px 35px;

            max-width: 550px;

            border-radius: 30px;

            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        h1 {
            color: #1d6090;

            font-family: Georgia, serif;

            font-size: 34px;
        }

        p {
            color: #555;

            font-size: 17px;

            line-height: 1.6;
        }

        .quote {
            margin-top: 25px;

            font-family: Georgia, serif;

            font-style: italic;

            color: #258b83;
        }

    </style>

</head>

<body>

    <div class="thank-you">

        <h1>Thank You! 💙</h1>

        <p>
            Your donation details have been submitted successfully.
        </p>

        <p>
            Your contribution can make a meaningful difference.
        </p>

        <div class="quote">
            “A small act of giving can create a big change.”
        </div>

    </div>

</body>

</html>
